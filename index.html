<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkyLeague</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(-45deg, #0f0c29, #302b63, #24243e, #00d4ff);
            background-size: 400% 400%;
            animation: gradientBG 10s ease infinite;
            min-height: 100vh;
            color: #ffffff;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .navbar {
            /* Kolor wyspy dostosowany do ciemnych odcieni logo */
            background: rgba(15, 12, 41, 0.6);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 50px;
            padding: 10px 30px;
            margin: 20px auto;
            width: 90%;
            max-width: 1100px;
            display: flex;
            align-items: center;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        .nav-logo img {
            height: 45px;
            width: 45px;
            border-radius: 50%;
            object-fit: cover;
            /* Usunięto border: 2px solid #00d4ff; */
            margin-right: 20px;
        }

        .nav-links {
            display: flex;
            gap: 20px;
            flex-grow: 1;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            font-weight: 500;
            text-transform: uppercase;
            font-size: 0.85em;
        }

        .btn-admin {
            background: rgba(255, 255, 255, 0.1);
            padding: 8px 20px;
            border-radius: 20px;
            border: 1px solid #ffffff;
            text-decoration: none;
            color: #ffffff;
            font-size: 0.85em;
            transition: 0.3s;
        }

        .btn-admin:hover {
            background: #ffffff;
            color: #0f0c29;
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="nav-logo">
            <img src="603833806_122095940019185425_7589727124439574907_n.jpg" alt="Logo">
        </div>
        
        <div class="nav-links">
            <a href="#">Strona Główna</a>
            <a href="#">Tabela</a>
            <a href="#">Terminarz</a>
        </div>

        <a href="admin.html" class="btn-admin">Panel Admina</a>
    </nav>

</body>
</html>
