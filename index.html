<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Strona Ligi</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(125deg, #0f0c29, #302b63, #24243e);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            color: #ffffff;
            min-height: 100vh;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Menu typu "Wyspa" */
        .navbar {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 50px;
            padding: 10px 30px;
            margin: 20px auto;
            width: 90%;
            max-width: 1000px;
            display: flex;
            justify-content: space-between; /* Logo po lewej, linki po prawej */
            align-items: center;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        .nav-logo img {
            height: 50px;
            width: 50px;
            border-radius: 50%;
            border: 2px solid #00d4ff;
            object-fit: cover;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            margin-left: 30px;
            font-weight: 500;
            transition: 0.3s;
            text-transform: uppercase;
            font-size: 0.9em;
        }

        .nav-links a:hover { color: #00d4ff; }

        .main-content {
            text-align: center;
            margin-top: 100px;
        }

        h1 {
            font-size: 3.5em;
            color: #fff;
            text-shadow: 0 0 20px rgba(0, 212, 255, 0.3);
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="nav-logo">
            <img src="TUTAJ_WKLEJ_SWOJ_RAW_URL" alt="Logo">
        </div>
        <div class="nav-links">
            <a href="#">Strona Główna</a>
            <a href="#">Tabela</a>
            <a href="#">Terminarz</a>
            <a href="#">Kontakt</a>
        </div>
    </nav>

    <div class="main-content">
        <h1>SkyLeague</h1>
    </div>

</body>
</html>
